name: Deploy PencilProof Worker

on:
  push:
    branches: ["main"]
    paths:
      - "app/account/page.tsx"
      - "app/components/AccountNav.tsx"
      - "app/components/PreCheckoutAccountGate.tsx"
      - "lib/clerk-client.ts"
      - "worker/**"
      - "lib/analytics.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Run type check
        run: npm run typecheck

      - name: Build static assets
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsucGVuY2lscHJvb2YuY29tJA
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Purge protected analyzer cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          zone_id=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=pencilproof.com&status=active&per_page=1" \
            | jq -r '.result[0].id')
          test -n "${zone_id}" -a "${zone_id}" != "null"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"files":["https://audit.pencilproof.com/analyze/","https://audit.pencilproof.com/analyze"]}' \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" \
            | jq -e '.success == true'

# Deployment trigger: keep Worker deployment attached to main updates.
# Deployment trigger: refresh after Gemini model routing fix.
# Deployment trigger: refresh after enabled-model discovery fix.
# Deployment trigger: refresh after payment-option preservation fix.
# Deployment trigger: refresh after verified PR #28 merge.
# Deployment trigger: refresh after build reliability fix.
# Deployment trigger: refresh after OCR asset fallback fix.
# Deployment trigger: refresh after complete OCR asset fallback fix.
# Deployment trigger: refresh after dependency-install fix.
# Deployment trigger: refresh after PR #29 invalid-model fallback fix.
# Deployment trigger: refresh after PR #30 model fallback fix.
