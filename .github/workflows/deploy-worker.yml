name: Deploy PencilProof Worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - "lib/analytics.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Run type check
        run: npm run typecheck

      - name: Build static assets
        run: npm run build

      - name: Configure Clerk DNS records
        # One-time production setup; remove this step after Clerk verifies DNS.
        if: contains(github.event.head_commit.message, 'Configure Clerk DNS records')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error("CLOUDFLARE_API_TOKEN is not configured");
          const headers = {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          };
          const api = async (path, options = {}) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { ...options, headers: { ...headers, ...(options.headers ?? {}) } });
            const body = await response.json();
            if (!response.ok || !body.success) throw new Error(`${options.method ?? "GET"} ${path}: ${JSON.stringify(body.errors ?? body)}`);
            return body.result;
          };
          const zones = await api("/zones?name=pencilproof.com&status=active&per_page=1");
          const zone = zones[0];
          if (!zone?.id) throw new Error("Active pencilproof.com zone was not found");
          const records = [
            ["clerk", "frontend-api.clerk.services"],
            ["accounts", "accounts.clerk.services"],
            ["clkmail", "mail.t2owczsm1ohg.clerk.services"],
            ["clk._domainkey", "dkim1.t2owczsm1ohg.clerk.services"],
            ["clk2._domainkey", "dkim2.t2owczsm1ohg.clerk.services"],
          ];
          for (const [name, content] of records) {
            const fullName = `${name}.pencilproof.com`;
            const existing = await api(`/zones/${zone.id}/dns_records?type=CNAME&name=${encodeURIComponent(fullName)}&per_page=1`);
            const payload = { type: "CNAME", name: fullName, content, ttl: 300, proxied: false };
            if (!existing[0]) await api(`/zones/${zone.id}/dns_records`, { method: "POST", body: JSON.stringify(payload) });
            else if (existing[0].content !== content || existing[0].proxied) await api(`/zones/${zone.id}/dns_records/${existing[0].id}`, { method: "PUT", body: JSON.stringify(payload) });
          }
          console.log("Clerk DNS records configured idempotently");
          NODE

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

# Deployment trigger: keep Worker deployment attached to main updates.
# Deployment trigger: refresh after Gemini model routing fix.
# Deployment trigger: refresh after enabled-model discovery fix.
# Deployment trigger: refresh after payment-option preservation fix.
# Deployment trigger: refresh after verified PR #28 merge.
# Deployment trigger: refresh after build reliability fix.
# Deployment trigger: refresh after OCR asset fallback fix.
# Deployment trigger: refresh after complete OCR asset fallback fix.
# Deployment trigger: refresh after dependency-install fix.
# Deployment trigger: refresh after PR #29 invalid-model fallback fix.
# Deployment trigger: refresh after PR #30 model fallback fix.
