name: Verify PencilProof Worker

on:
  pull_request:
    branches: ["main"]
    paths:
      - "worker/**"
      - "lib/analytics.ts"
      - "wrangler.jsonc"
      - "wrangler.social.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-worker.yml"
      - ".github/workflows/deploy-worker.yml"
      - ".github/workflows/deploy-social.yml"
      - ".github/workflows/analytics-report.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Run type check
        run: npm run typecheck

      - name: Build static assets
        run: npm run build
