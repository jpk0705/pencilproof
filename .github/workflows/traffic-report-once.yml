name: One-time PencilProof traffic report

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/traffic-report-once.yml"
      - ".github/traffic-report-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch dated analytics summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import urllib.request

          url = "https://audit.pencilproof.com/api/analytics/summary"
          request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "PencilProof-Traffic-Report/1.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          today = dt.datetime.now(dt.timezone.utc).date()
          days = [(today - dt.timedelta(days=offset)).isoformat() for offset in range(6, -1, -1)]
          by_day = payload.get("byDay") or {}
          selected = {day: by_day.get(day, {}) for day in days}
          totals = {}
          for events in selected.values():
              for event, count in events.items():
                  totals[event] = totals.get(event, 0) + int(count)

          print("TRAFFIC_REPORT_BEGIN")
          print(json.dumps({
              "range_utc": {"start": days[0], "end": days[-1]},
              "by_day": selected,
              "totals": totals,
              "all_time_sessions": payload.get("sessions", 0),
              "analytics_updated_at": payload.get("updatedAt", ""),
          }, sort_keys=True))
          print("TRAFFIC_REPORT_END")
          PY
