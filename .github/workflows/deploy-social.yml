name: Deploy PencilProof Social Worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/social.mjs"
      - "worker/social.test.mjs"
      - "worker/social-direct.mjs"
      - "worker/social-direct.test.mjs"
      - "worker/social-facebook.mjs"
      - "worker/social-facebook.test.mjs"
      - "wrangler.social.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-social.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Deploy social Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.social.jsonc
