name: PencilProof Analytics Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Keep private analytics in the dashboard
        run: |
          echo "PencilProof analytics are private and are not copied into GitHub Actions."
          echo "Use the authenticated dashboard at https://audit.pencilproof.com/analytics."
