<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">Full monthly car ownership budget</title><desc id="desc">Fictional educational budget showing a 601 dollar payment plus ownership estimates totaling 1031 dollars.</desc><rect width="1080" height="1920" fill="#f5f1e8"/><text x="72" y="145" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#a1452d">PENCILPROOF</text><text x="72" y="280" font-family="Arial,sans-serif" font-size="70" font-weight="800" fill="#172033">The payment</text><text x="72" y="365" font-family="Arial,sans-serif" font-size="70" font-weight="800" fill="#172033">is not the budget.</text><text x="72" y="450" font-family="Arial,sans-serif" font-size="34" fill="#4b5563">Fictional monthly ownership estimate</text><g font-family="Arial,sans-serif"><rect x="72" y="560" width="936" height="180" rx="28" fill="#fff" stroke="#172033" stroke-width="5"/><text x="120" y="675" font-size="46" fill="#172033">Car payment</text><text x="940" y="675" text-anchor="end" font-size="58" font-weight="800" fill="#a1452d">$601</text><rect x="72" y="780" width="936" height="180" rx="28" fill="#fff" stroke="#172033" stroke-width="5"/><text x="120" y="895" font-size="46" fill="#172033">Insurance estimate</text><text x="940" y="895" text-anchor="end" font-size="58" font-weight="800" fill="#a1452d">$180</text><rect x="72" y="1000" width="936" height="180" rx="28" fill="#fff" stroke="#172033" stroke-width="5"/><text x="120" y="1115" font-size="46" fill="#172033">Fuel estimate</text><text x="940" y="1115" text-anchor="end" font-size="58" font-weight="800" fill="#a1452d">$160</text><rect x="72" y="1220" width="936" height="180" rx="28" fill="#fff" stroke="#172033" stroke-width="5"/><text x="120" y="1335" font-size="46" fill="#172033">Maintenance reserve</text><text x="940" y="1335" text-anchor="end" font-size="58" font-weight="800" fill="#a1452d">$90</text></g><rect x="72" y="1490" width="936" height="220" rx="32" fill="#172033"/><text x="120" y="1630" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#fff">Illustrative total</text><text x="940" y="1630" text-anchor="end" font-family="Arial,sans-serif" font-size="70" font-weight="800" fill="#fff">$1,031/mo</text><text x="540" y="1810" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#a1452d">Educational estimate, not financial advice.</text></svg>
