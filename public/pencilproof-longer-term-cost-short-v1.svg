<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">Longer car loan term comparison</title><desc id="desc">Fictional educational comparison of a 30000 dollar loan at 7.50 percent APR over 60 and 72 months.</desc><rect width="1080" height="1920" fill="#f5f1e8"/><text x="72" y="145" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#a1452d">PENCILPROOF</text><text x="72" y="270" font-family="Arial,sans-serif" font-size="72" font-weight="800" fill="#172033">Lower payment.</text><text x="72" y="355" font-family="Arial,sans-serif" font-size="72" font-weight="800" fill="#172033">Higher total cost.</text><text x="72" y="430" font-family="Arial,sans-serif" font-size="34" fill="#4b5563">Fictional estimate · $30,000 at 7.50% APR</text><g font-family="Arial,sans-serif"><rect x="72" y="520" width="444" height="650" rx="36" fill="#fff" stroke="#172033" stroke-width="6"/><text x="294" y="630" text-anchor="middle" font-size="48" font-weight="800" fill="#172033">60 MONTHS</text><text x="294" y="790" text-anchor="middle" font-size="64" font-weight="800" fill="#a1452d">$601.14</text><text x="294" y="855" text-anchor="middle" font-size="34" fill="#4b5563">estimated monthly</text><text x="294" y="1010" text-anchor="middle" font-size="48" font-weight="700" fill="#172033">$36,068</text><text x="294" y="1070" text-anchor="middle" font-size="30" fill="#4b5563">estimated total</text><rect x="564" y="520" width="444" height="650" rx="36" fill="#fff" stroke="#a1452d" stroke-width="10"/><text x="786" y="630" text-anchor="middle" font-size="48" font-weight="800" fill="#172033">72 MONTHS</text><text x="786" y="790" text-anchor="middle" font-size="64" font-weight="800" fill="#a1452d">$518.70</text><text x="786" y="855" text-anchor="middle" font-size="34" fill="#4b5563">estimated monthly</text><text x="786" y="1010" text-anchor="middle" font-size="48" font-weight="700" fill="#172033">$37,347</text><text x="786" y="1070" text-anchor="middle" font-size="30" fill="#4b5563">estimated total</text></g><rect x="72" y="1260" width="936" height="380" rx="36" fill="#172033"/><text x="120" y="1380" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#fff">72 months = about $1,278</text><text x="120" y="1450" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#fff">more estimated interest</text><text x="120" y="1540" font-family="Arial,sans-serif" font-size="34" fill="#fff">Match balance · APR · term · total payments</text><text x="540" y="1770" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="#a1452d">Educational estimate, not financial advice.</text></svg>
