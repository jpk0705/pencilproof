<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Side-by-side dealer quote comparison</title>
  <desc id="desc">Anonymous educational graphic comparing 29400 dollars financed for 60 months with 31740 dollars financed for 72 months.</desc>
  <rect width="1080" height="1920" fill="#f5f1e8"/>
  <text x="72" y="145" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#a1452d">PENCILPROOF</text>
  <text x="72" y="270" font-family="Arial,sans-serif" font-size="72" font-weight="800" fill="#172033">Lower payment.</text>
  <text x="72" y="355" font-family="Arial,sans-serif" font-size="72" font-weight="800" fill="#172033">$2,340 more financed.</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="470" width="444" height="630" rx="36" fill="#fff" stroke="#172033" stroke-width="6"/>
    <text x="294" y="570" text-anchor="middle" font-size="48" font-weight="800" fill="#172033">QUOTE A</text>
    <text x="294" y="720" text-anchor="middle" font-size="66" font-weight="800" fill="#a1452d">$29,400</text>
    <text x="294" y="785" text-anchor="middle" font-size="34" fill="#4b5563">amount financed</text>
    <text x="294" y="930" text-anchor="middle" font-size="56" font-weight="700" fill="#172033">60 months</text>
    <rect x="564" y="470" width="444" height="630" rx="36" fill="#fff" stroke="#a1452d" stroke-width="10"/>
    <text x="786" y="570" text-anchor="middle" font-size="48" font-weight="800" fill="#172033">QUOTE B</text>
    <text x="786" y="720" text-anchor="middle" font-size="66" font-weight="800" fill="#a1452d">$31,740</text>
    <text x="786" y="785" text-anchor="middle" font-size="34" fill="#4b5563">amount financed</text>
    <text x="786" y="930" text-anchor="middle" font-size="56" font-weight="700" fill="#172033">72 months</text>
  </g>
  <rect x="72" y="1190" width="936" height="470" rx="36" fill="#172033"/>
  <text x="120" y="1300" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#fff">MATCH THE BASELINE</text>
  <g font-family="Arial,sans-serif" font-size="38" fill="#fff">
    <text x="120" y="1400">✓ vehicle + equipment</text>
    <text x="120" y="1470">✓ trade + cash down</text>
    <text x="120" y="1540">✓ APR + term</text>
    <text x="570" y="1400">✓ price + fees</text>
    <text x="570" y="1470">✓ optional products</text>
    <text x="570" y="1540">✓ amount financed</text>
  </g>
  <text x="540" y="1760" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="800" fill="#a1452d">Deal first. Payment second.</text>
</svg>
