<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">Before you sign car quote checklist</title><desc id="desc">Anonymous checklist of vehicle, price, fees, products, trade, and finance terms.</desc><rect width="1080" height="1920" fill="#f5f1e8"/><text x="72" y="145" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#a1452d">PENCILPROOF</text><text x="72" y="280" font-family="Arial,sans-serif" font-size="70" font-weight="800" fill="#172033">Before you sign,</text><text x="72" y="365" font-family="Arial,sans-serif" font-size="70" font-weight="800" fill="#172033">check every line.</text><g font-family="Arial,sans-serif" font-size="43" fill="#172033"><rect x="72" y="510" width="936" height="150" rx="24" fill="#fff" stroke="#172033" stroke-width="5"/><text x="120" y="605">□ Vehicle + selling price</text><rect x="72" y="700" width="936" height="150" rx="24" fill="#fff" stroke="#172033" stroke-width="5"/><text x="120" y="795">□ Taxes + government charges</text><rect x="72" y="890" width="936" height="150" rx="24" fill="#fff" stroke="#172033" stroke-width="5"/><text x="120" y="985">□ Dealer fees + products</text><rect x="72" y="1080" width="936" height="150" rx="24" fill="#fff" stroke="#172033" stroke-width="5"/><text x="120" y="1175">□ Trade + cash down</text><rect x="72" y="1270" width="936" height="150" rx="24" fill="#fff" stroke="#172033" stroke-width="5"/><text x="120" y="1365">□ APR + term</text><rect x="72" y="1460" width="936" height="150" rx="24" fill="#172033"/><text x="120" y="1555" fill="#fff">□ Amount + payment + total</text></g><text x="540" y="1770" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="#a1452d">Review the written quote before signing.</text></svg>
