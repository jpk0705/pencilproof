<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">Amount financed versus total of payments</title><desc id="desc">Fictional educational example of 30000 dollars financed becoming 36068 dollars in estimated total payments.</desc><rect width="1080" height="1920" fill="#f5f1e8"/><text x="72" y="145" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#a1452d">PENCILPROOF</text><text x="72" y="280" font-family="Arial,sans-serif" font-size="70" font-weight="800" fill="#172033">Borrowed balance.</text><text x="72" y="365" font-family="Arial,sans-serif" font-size="70" font-weight="800" fill="#172033">Total repayment.</text><text x="72" y="450" font-family="Arial,sans-serif" font-size="34" fill="#4b5563">Fictional estimate · $30,000 · 7.50% APR · 60 months</text><rect x="72" y="560" width="936" height="300" rx="36" fill="#fff" stroke="#172033" stroke-width="6"/><text x="120" y="680" font-family="Arial,sans-serif" font-size="42" fill="#4b5563">AMOUNT FINANCED</text><text x="120" y="800" font-family="Arial,sans-serif" font-size="76" font-weight="800" fill="#a1452d">$30,000</text><rect x="72" y="950" width="936" height="300" rx="36" fill="#172033"/><text x="120" y="1070" font-family="Arial,sans-serif" font-size="42" fill="#fff">TOTAL OF PAYMENTS</text><text x="120" y="1190" font-family="Arial,sans-serif" font-size="76" font-weight="800" fill="#fff">$36,068.31</text><text x="120" y="1400" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#172033">Estimated finance charge</text><text x="120" y="1490" font-family="Arial,sans-serif" font-size="64" font-weight="800" fill="#a1452d">$6,068.31</text><text x="540" y="1770" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="#a1452d">Educational estimate, not financial advice.</text></svg>
